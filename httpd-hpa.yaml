apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: http-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: httpd-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10  # 안정화 대기시간
      policies:              # pod을 1개씩 줄이는 정책
      - type: Pods
        value: 1
        periodSeconds: 20    # 정책의 유효시간
